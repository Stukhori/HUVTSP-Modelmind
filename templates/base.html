<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14213d">
    <title>{% block title %}ModelMind{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="{{ url_for('home') }}" aria-label="ModelMind home">
                <span class="brand__mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" role="img">
                        <path d="M7 6.5h18v19H7z" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M11 12h10M11 16h10M11 20h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="23" cy="21" r="5" fill="#62d6b4" stroke="#14213d" stroke-width="2"/>
                        <path d="m26.5 24.5 3 3" stroke="#14213d" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span><strong>ModelMind</strong><small>Workbook intelligence</small></span>
            </a>
            <nav class="site-nav" aria-label="Primary navigation">
                {% if session.get('file_data') %}<a href="{{ url_for('result') }}">Current analysis</a>{% else %}<a href="{{ url_for('home') }}">New analysis</a>{% endif %}
                <a href="https://github.com/Stukhori/HUVTSP-Modelmind" rel="noreferrer">Source code</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer"><p>ModelMind · Natural-language analysis for Excel workbooks</p></footer>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
